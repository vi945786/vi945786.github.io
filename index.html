<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REVIVAL 2026 Fall</title>
  <style>
    html, body { margin: 0; padding: 0; background: #fff; }
    #comic { margin: 0; padding: 0; }
    .page { width: 100vw; height: 100vh; background: #fff; }
    .page img { display: block; width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <main id="comic"></main>
  <script>(() => {
    const PAGE_COUNT = 59;
    const comic = document.getElementById("comic");
    const pages = [];

    function loadPage(item) {
      if (item.loaded) return;
      item.loaded = true;
      item.image.src = `pages/revival-page-${String(item.number).padStart(2, "0")}.jpg`;
    }

    for (let number = 1; number <= PAGE_COUNT; number += 1) {
      const element = document.createElement("section");
      const image = document.createElement("img");
      element.className = "page";
      image.alt = `REVIVAL Fall 2026 - page ${number}`;
      image.decoding = "async";
      if (number === 1) image.fetchPriority = "high";
      element.append(image);
      comic.append(element);
      pages.push({ number, element, image, loaded: false });
    }

    const observer = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        const item = pages.find(({ element }) => element === entry.target);
        if (item) loadPage(item);
        observer.unobserve(entry.target);
      }
    }, { rootMargin: "50% 0px" });

    pages.forEach(({ element }) => observer.observe(element));
    loadPage(pages[0]);
  })()</script>
</body>
</html>
